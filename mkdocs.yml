site_name: ugv_ws Documentation
site_description: ROS2 Humble colcon workspace (ugv_ws) for WaveShare UGV ROS2 Kit robots
site_url: https://waveshareteam.github.io/ugv_ws

repo_name: ugv_ws
repo_url: https://github.com/waveshareteam/ugv_ws
edit_uri: edit/ros2-humble-develop-251125/docs/

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true

nav:
  - ugv_ws Documentation: index.md
  - Getting Started:
    - ROS2 Basics: ros2_basics.md
    - UGV Basics: ugv_basics.md
    - Installation: installation.md
  - Tutorials:
    - Robot Description: description.md
    - Hardware Driver: bringup.md
    - Keyboard & Gamepad Control: teleoperation.md
    - LiDAR Interaction: lidar.md
    - Vision: vision.md
    - Mapping: mapping.md
    - Web App: web_app.md
    - Navigation: navigation.md
    - Behavior Command Control: behavior_ctrl.md
    - Experimental: experimental.md
    - Gazebo: gazebo.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/copy-button.js
  - javascripts/image-lightbox.js
